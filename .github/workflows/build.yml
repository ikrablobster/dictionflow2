name: Build DictaFlow

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Установка LLVM/Clang для whisper.cpp
        run: choco install llvm -y

      - name: Установка npm-зависимостей
        run: npm ci

      - name: Проверка frontend
        run: npm run build

      - name: Тесты интерфейса
        run: npm test

      - name: Проверка Rust
        working-directory: src-tauri
        run: cargo test --release

      - name: Сборка и упаковка Windows
        run: npm run tauri build

      - name: Проверка распознавания контрольной аудиозаписи
        working-directory: src-tauri
        run: cargo test --release transcribes_official_whisper_sample -- --ignored

      - name: Загрузка установщиков
        uses: actions/upload-artifact@v4
        with:
          name: dictaflow-windows
          path: |
            src-tauri/target/release/dictaflow.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
