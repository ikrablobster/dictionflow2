name: Build DictaFlow

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # --- Только Windows: системные зависимости для сборки whisper.cpp/webrtc-vad ---
      - name: Установка LLVM/Clang (Windows, нужен биндингам whisper.cpp)
        if: matrix.platform == 'windows-latest'
        run: choco install llvm -y

      - name: Установка npm-зависимостей
        run: npm ci

      - name: Генерация полного набора иконок (ico/icns) из исходной PNG
        run: npx tauri icon src-tauri/icons/icon-source.png -o src-tauri/icons

      - name: Сборка и упаковка приложения
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.0
          releaseName: "dictaflow-v0.1.0"
          releaseBody: "Автоматическая сборка DictaFlow. Скачай установщик для своей ОС из Assets ниже."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Загрузка артефактов сборки (доступны даже без релиза/тега)
        uses: actions/upload-artifact@v4
        with:
          name: dictaflow-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
